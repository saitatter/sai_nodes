<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101217">
  <meta name="description" content="Seven interactive sai_nodes examples: visual scripting, workflows, live shaders, data pipelines, neural networks, modular audio, and idea maps. Built with Flutter and Dart.">
  <meta property="og:title" content="sai_nodes · The graph playground">
  <meta property="og:description" content="One canvas. Seven starting points. Explore real, editable graph examples in your browser.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>sai_nodes · The graph playground</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #101217; color: #e9eaf0; font: 14px Arial, sans-serif; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; }
    #loading strong { font-size: 28px; letter-spacing: -1px; } #loading span { color: #969bab; }
    .dots { color: #b3a2ff; letter-spacing: 12px; animation: breathe 1.5s ease-in-out infinite alternate; }
    @keyframes breathe { to { opacity: .3; } } @media (prefers-reduced-motion: reduce) { .dots { animation: none; } }
    a { color: #b3a2ff; } noscript { display: block; padding: 30px; text-align: center; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>sai_nodes</strong><span class="dots" aria-hidden="true">● ● ●</span><span>Connecting the dots…</span></div>
  <noscript>This interactive Flutter gallery needs JavaScript. <a href="https://github.com/saitatter/sai_nodes">Browse the source and examples on GitHub.</a></noscript>
  <script src="gallery.js"></script>
  <script>
    addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
    setTimeout(() => { const loader = document.getElementById('loading'); if (loader) loader.innerHTML = '<strong>sai_nodes</strong><span>The playground is taking a little longer to load.</span><a href="">Reload the page</a>'; }, 25000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
