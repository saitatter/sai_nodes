name: sai_nodes
description: A lightweight, scalable, and highly customizable package for building interactive node-based UIs in Flutter.
version: 0.2.1
maintainer: SaiTatter

homepage: https://github.com/saitatter/sai_nodes
repository: https://github.com/saitatter/sai_nodes
issue_tracker: https://github.com/saitatter/sai_nodes/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - visual-scripting
  - workflow-editor
  - node-editor

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_context_menu: ^0.4.2
  flutter_shaders: ^0.1.3
  uuid: ^4.5.1
  vector_math: ^2.2.0

flutter:
  shaders:
    - shaders/grid.frag

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  test_coverage_badge: ^0.3.2
