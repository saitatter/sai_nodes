name: Attach package archive to GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_version="$(sed -n -E 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '[:space:]"')"

          if [ "$expected_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match pubspec.yaml version $package_version."
            exit 1
          fi

      - name: Create source archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          git archive --format=zip --output="dist/sai_nodes-${version}.zip" HEAD
          git archive --format=tar.gz --output="dist/sai_nodes-${version}.tar.gz" HEAD

      - name: Upload archives to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
